[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "band2sheet"
version = "0.1.0"
description = "유튜브/음원을 악기별로 분리해 자동으로 악보(MusicXML/MIDI/코드표)를 만들고 조옮김까지 하는 도구"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "soundfile",
    "librosa>=0.10",
    "music21>=9",
    "pretty_midi",
    "yt-dlp",
]

[project.optional-dependencies]
# 음원 분리(Demucs)와 다성 채보(Basic Pitch). 대부분의 사용자는 이것까지 설치합니다.
ml = [
    "torch",
    "demucs>=4",
    "basic-pitch",
]
# 더 자세한 분리/채보 엔진 (메인·코러스 분리, 드럼 조각, CREPE, 피아노 페달, 다운비트)
detail = [
    "audio-separator",
    "torchcrepe",
    "piano-transcription-inference",
    "beat-this",
]
lyrics = ["faster-whisper"]
app = ["fastapi", "uvicorn", "python-multipart"]
# MuseScore 없이 PDF 악보 만들기
pdf = ["verovio", "cairosvg", "pypdf"]
all = ["band2sheet[ml,detail,lyrics,app,pdf]"]
dev = ["pytest", "httpx"]

[project.scripts]
band2sheet = "band2sheet.cli:main"

[tool.setuptools]
packages = ["band2sheet", "band2sheet.app"]

[tool.setuptools.package-data]
"band2sheet.app" = ["static/*", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: 합성 음원으로 전체 파이프라인을 돌리는 느린 테스트"]
